name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0)"
        required: true

  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          # Strip leading 'v' (v1.0.0 → 1.0.0)
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          # AssemblyVersion must be purely numeric — strip prerelease suffix (0.1.0-beta → 0.1.0)
          echo "assembly_version=$(echo $VERSION | cut -d'-' -f1).0" >> $GITHUB_OUTPUT

      - name: Install git-cliff
        shell: bash
        run: choco install git-cliff -y --no-progress

      - name: Generate changelog (full history)
        shell: bash
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: git cliff --config cliff.toml --output CHANGELOG.md

      - name: Generate changelog (latest release)
        shell: bash
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: git cliff --config cliff.toml --latest --strip header --output CHANGES.md

      - name: Update plugin manifest version
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $json = Get-Content FFXIVDiscordBridgePlugin.json -Raw | ConvertFrom-Json
          $json.TestingAssemblyVersion = "$v.0"
          $json | ConvertTo-Json -Depth 10 | Set-Content FFXIVDiscordBridgePlugin.json

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/goatcorp/dalamud-distrib/raw/main/latest.zip" -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        shell: pwsh
        run: >
          dotnet build FFXIVDiscordBridgePlugin.csproj
          -c Release
          /p:Version=${{ steps.ver.outputs.version }}
          /p:AssemblyVersion=${{ steps.ver.outputs.assembly_version }}

      - name: Update repo.json version and changelog
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $changelog = Get-Content "CHANGES.md" -Raw -ErrorAction SilentlyContinue
          $json = Get-Content repo.json -Raw | ConvertFrom-Json
          $json[0].AssemblyVersion = "$v.0.0"
          $json[0].LastUpdate = [int][double]::Parse((Get-Date -UFormat %s))
          if ($changelog) { $json[0].Changelog = $changelog.Trim() }
          $json | ConvertTo-Json -Depth 10 | Set-Content repo.json

      - name: Commit updated manifests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json FFXIVDiscordBridgePlugin.json CHANGELOG.md
          git commit -m "chore: bump manifests to ${{ steps.ver.outputs.version }}"
          git push origin HEAD:main

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv bin/x64/Release/FFXIVDiscordBridgePlugin/latest.zip FFXIVDiscordBridgePlugin.zip
          gh release create "v${{ steps.ver.outputs.version }}" \
            --title "v${{ steps.ver.outputs.version }}" \
            --notes-file CHANGES.md \
            --target main \
            FFXIVDiscordBridgePlugin.zip
