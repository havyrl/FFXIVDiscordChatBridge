name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0)"
        required: true

  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        shell: bash
        run: git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .

      - name: Setup .NET 10
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile dotnet-install.ps1
          ./dotnet-install.ps1 -Channel "10.0" -InstallDir "$env:LOCALAPPDATA\Microsoft\dotnet"
          "$env:LOCALAPPDATA\Microsoft\dotnet" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Strip leading 'v' from tag (v1.0.0 → 1.0.0)
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Update plugin manifest version
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $json = Get-Content FFXIVDiscordBridgePlugin.json -Raw | ConvertFrom-Json
          $json.TestingAssemblyVersion = "$v.0"
          $json | ConvertTo-Json -Depth 10 | Set-Content FFXIVDiscordBridgePlugin.json

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/goatcorp/dalamud-distrib/raw/main/latest.zip" -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        shell: pwsh
        run: >
          dotnet build FFXIVDiscordBridgePlugin.csproj
          -c Release
          /p:Version=${{ steps.ver.outputs.version }}
          /p:AssemblyVersion=${{ steps.ver.outputs.version }}.0
          -o publish

      - name: Update repo.json version
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $json = Get-Content repo.json -Raw | ConvertFrom-Json
          $json[0].AssemblyVersion = "$v.0.0"
          $json | ConvertTo-Json -Depth 10 | Set-Content repo.json

      - name: Commit updated manifests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json FFXIVDiscordBridgePlugin.json
          git commit -m "chore: bump manifests to ${{ steps.ver.outputs.version }}"
          git push origin HEAD:main

      - name: Package
        shell: pwsh
        run: |
          # Remove Dalamud-provided assemblies (not needed in the ZIP)
          Remove-Item publish\Dalamud.* -ErrorAction SilentlyContinue
          Compress-Archive -Path publish\* -DestinationPath FFXIVDiscordBridgePlugin.zip

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            --title "v${{ steps.ver.outputs.version }}" \
            --generate-notes \
            --target main \
            FFXIVDiscordBridgePlugin.zip
