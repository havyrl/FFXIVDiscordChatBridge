name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.2.0-beta.20260318)"
        required: true

jobs:
  # ── Job 1: Changelog (ubuntu — git-cliff-action requires Linux) ────────────
  changelog:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      version: ${{ steps.ver.outputs.version }}
      assembly_version: ${{ steps.ver.outputs.assembly_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Determine version
        id: ver
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "assembly_version=$(echo $VERSION | cut -d'-' -f1).0" >> $GITHUB_OUTPUT

      - name: Install git-cliff
        run: |
          CLIFF_URL=$(curl -s https://api.github.com/repos/orhun/git-cliff/releases/latest \
            | jq -r '.assets[] | select(.name | test("x86_64-unknown-linux-gnu.tar.gz$")) | .browser_download_url')
          curl -sSfL "$CLIFF_URL" | tar -xz --wildcards --strip-components=1 -C /usr/local/bin "*/git-cliff"

      - name: Generate changelog (full history)
        run: git cliff --config cliff.toml --output CHANGELOG.md
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate changelog (latest release)
        run: git cliff --config cliff.toml --latest --strip header --output CHANGES.md
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md CHANGES.md
          git diff --cached --quiet || git commit -m "docs: update changelog for v${{ steps.ver.outputs.version }}"
          git push origin HEAD:main

  # ── Job 2: Build & Release (windows — net10.0-windows requires Windows) ───
  build-release:
    runs-on: windows-latest
    needs: changelog

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}
          ref: main
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: packages.lock.json

      - name: Update plugin manifest version
        shell: pwsh
        run: |
          $v = "${{ needs.changelog.outputs.version }}"
          $json = Get-Content FFXIVDiscordBridgePlugin.json -Raw | ConvertFrom-Json
          $json.TestingAssemblyVersion = "$v.0"
          $json | ConvertTo-Json -Depth 10 | Set-Content FFXIVDiscordBridgePlugin.json

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/goatcorp/dalamud-distrib/raw/main/latest.zip" -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        shell: pwsh
        run: >
          dotnet build FFXIVDiscordBridgePlugin.csproj
          -c Release
          /p:Version=${{ needs.changelog.outputs.version }}
          /p:AssemblyVersion=${{ needs.changelog.outputs.assembly_version }}

      - name: Update repo.json version and changelog
        shell: pwsh
        run: |
          $v = "${{ needs.changelog.outputs.version }}"
          $changelog = Get-Content "CHANGES.md" -Raw -ErrorAction SilentlyContinue
          $json = Get-Content repo.json -Raw | ConvertFrom-Json
          $json[0].AssemblyVersion = "${{ needs.changelog.outputs.assembly_version }}"
          $json[0].LastUpdate = [int][double]::Parse((Get-Date -UFormat %s))
          if ($changelog) { $json[0].Changelog = $changelog.Trim() }
          ConvertTo-Json -InputObject $json -Depth 10 | Set-Content repo.json

      - name: Commit updated manifests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json FFXIVDiscordBridgePlugin.json
          git commit -m "chore: bump manifests to ${{ needs.changelog.outputs.version }}"
          git push origin HEAD:main

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem -Recurse -Filter "latest.zip" | Select-Object -First 1
          if (-not $zip) { Write-Error "latest.zip not found"; exit 1 }
          Write-Host "Found zip at: $($zip.FullName)"
          Copy-Item $zip.FullName FFXIVDiscordBridgePlugin.zip
          $v = "${{ needs.changelog.outputs.version }}"
          $args = @("release", "create", "v$v", "--title", "v$v", "--target", "main", "FFXIVDiscordBridgePlugin.zip")
          if (Test-Path "CHANGES.md") { $args += @("--notes-file", "CHANGES.md") } else { $args += @("--notes", "") }
          & gh @args
